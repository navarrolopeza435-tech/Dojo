<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6b4428">
<title>Dojo · Plan semanal</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --washi:#fbfaf5; --washi-2:#f3efe4; --hinoki:#c9a27a; --hinoki-2:#dcc1a0;
  --keyaki:#6b4428; --keyaki-2:#55351f; --sumi:#29211b; --sumi-2:#5e5247;
  --sakura:#f3b8c8; --sakura-deep:#c94f73; --shu:#b7372c;
  --floor-a:#b98a5e; --floor-b:#a97b51; --floor-line:#8d6440;
  --card:#fbfaf5; --line:#e6dccb;
  --fig-ink:#29211b; --fig-far:#b2a393; --fig-prop:#c2410c; --fig-alt:#4d7c6f;
  --fig-floor:#cdbca4; --fig-arrow:#c94f73; --fig-muted:#7a6c5d; --fig-bag:#eadbc6;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",Georgia,serif;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --washi:#221d18; --washi-2:#2a241e; --hinoki:#7d5f42; --hinoki-2:#5f4832;
    --keyaki:#3d2615; --keyaki-2:#2e1c0f; --sumi:#efe7da; --sumi-2:#b9ab99;
    --sakura:#e79ab0; --sakura-deep:#ee7f9f; --shu:#e0574a;
    --floor-a:#3b2a1d; --floor-b:#34251a; --floor-line:#2a1d13;
    --card:#221d18; --line:#3a3128;
    --fig-ink:#efe7da; --fig-far:#857766; --fig-prop:#f08a4b; --fig-alt:#7fb3a4;
    --fig-floor:#5a4a3a; --fig-arrow:#ee7f9f; --fig-muted:#a99a88; --fig-bag:#4a3b2c;
  }
}
:root[data-theme="dark"]{
  --washi:#221d18; --washi-2:#2a241e; --hinoki:#7d5f42; --hinoki-2:#5f4832;
  --keyaki:#3d2615; --keyaki-2:#2e1c0f; --sumi:#efe7da; --sumi-2:#b9ab99;
  --sakura:#e79ab0; --sakura-deep:#ee7f9f; --shu:#e0574a;
  --floor-a:#3b2a1d; --floor-b:#34251a; --floor-line:#2a1d13;
  --card:#221d18; --line:#3a3128;
  --fig-ink:#efe7da; --fig-far:#857766; --fig-prop:#f08a4b; --fig-alt:#7fb3a4;
  --fig-floor:#5a4a3a; --fig-arrow:#ee7f9f; --fig-muted:#a99a88; --fig-bag:#4a3b2c;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--sans); color:var(--sumi); line-height:1.55;
  background:
    repeating-linear-gradient(90deg, transparent 0 74px, var(--floor-line) 74px 76px),
    repeating-linear-gradient(90deg, var(--floor-a) 0 38px, var(--floor-b) 38px 76px);
  background-attachment:fixed;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sakura-deep);outline-offset:2px}

/* ---------- shoji + sakura header ---------- */
.shoji{
  position:relative; overflow:hidden; height:250px;
  background:
    repeating-linear-gradient(90deg, transparent 0 calc(25% - 3px), var(--hinoki-2) calc(25% - 3px) 25%),
    repeating-linear-gradient(0deg, transparent 0 64px, var(--hinoki-2) 64px 67px),
    var(--washi);
  border-bottom:0;
}
.shoji::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 60%, rgba(107,68,40,.10));pointer-events:none}
.tree{position:absolute;right:-4px;bottom:0;width:min(460px,100%);height:auto}
.scroll{
  position:absolute;left:18px;top:22px;width:62px;padding:14px 0 18px;
  background:var(--washi); border:1px solid var(--hinoki);
  box-shadow:0 6px 14px rgba(41,33,27,.12);
  display:flex;flex-direction:column;align-items:center;gap:10px;z-index:2;
}
.scroll::before,.scroll::after{content:"";position:absolute;left:-6px;right:-6px;height:7px;background:var(--keyaki);border-radius:3px}
.scroll::before{top:-5px}.scroll::after{bottom:-5px}
.scroll h1{
  margin:0;font-family:var(--serif);font-weight:800;font-size:34px;line-height:1.05;
  writing-mode:vertical-rl;letter-spacing:.12em;color:var(--sumi);inline-size:max-content;
}
.seal{width:24px;height:24px;background:var(--shu);color:#fff;font-family:var(--serif);font-size:11px;
  display:grid;place-items:center;border-radius:3px;line-height:1;transform:rotate(-4deg)}
.intro{position:absolute;left:96px;top:30px;max-width:170px;z-index:2}
.intro p{margin:0;font-size:13px;color:var(--sumi-2);line-height:1.5}
.intro strong{display:block;font-family:var(--serif);font-size:19px;color:var(--sumi);line-height:1.25;margin-bottom:6px;font-weight:800}

.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.petal{position:absolute;top:-20px;width:10px;height:8px;background:var(--sakura);
  border-radius:100% 0 100% 0;opacity:.9;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate3d(0,-20px,0) rotate(0)}
  50%{transform:translate3d(-30px,150px,0) rotate(160deg)}
  100%{transform:translate3d(-10px,320px,0) rotate(320deg)}
}
@media (prefers-reduced-motion: reduce){ .petal{display:none} }

/* ---------- beam + plaques (sticky nav) ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.beam{height:18px;background:
   repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 5px),
   linear-gradient(180deg, var(--keyaki) , var(--keyaki-2));
  box-shadow:0 3px 6px rgba(0,0,0,.25)}
.plaques{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 10px 12px;
  background:linear-gradient(180deg, var(--floor-line), var(--floor-b));box-shadow:0 6px 10px rgba(0,0,0,.22)}
.plaque{
  position:relative;border:0;padding:8px 0 6px;margin-top:10px;
  background:linear-gradient(180deg,var(--hinoki-2),var(--hinoki));
  color:#2b1d12;border-radius:3px 3px 6px 6px;
  box-shadow:0 3px 5px rgba(0,0,0,.25), inset 0 0 0 1px rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px;
}
.plaque::before{content:"";position:absolute;top:-10px;left:50%;width:1.5px;height:10px;background:rgba(0,0,0,.35)}
.plaque .k{font-family:var(--serif);font-weight:800;font-size:22px;line-height:1.1}
.plaque .s{font-size:11px;font-weight:500;opacity:.85}
.plaque[aria-selected="true"]{background:var(--washi);color:var(--sumi);transform:translateY(3px);
  box-shadow:0 5px 10px rgba(0,0,0,.3), inset 0 0 0 2px var(--sakura-deep)}
.plaque .today{position:absolute;right:-4px;top:-6px;width:16px;height:16px;background:var(--shu);color:#fff;
  font-family:var(--serif);font-size:9px;display:grid;place-items:center;border-radius:2px;transform:rotate(6deg)}

/* ---------- day ---------- */
main{max-width:640px;margin:0 auto;padding:6px 12px 40px}
.dayhead{background:var(--washi);border:1px solid var(--hinoki);padding:16px 16px 14px;margin:6px 0 14px;
  box-shadow:0 8px 18px rgba(0,0,0,.18);position:relative}
.dayhead .jp{font-family:var(--serif);font-size:15px;color:var(--sakura-deep);font-weight:600;letter-spacing:.08em}
.dayhead h2{margin:2px 0 4px;font-family:var(--serif);font-weight:800;font-size:25px;line-height:1.2}
.dayhead .what{margin:0;font-size:15px;color:var(--sumi-2)}
.dayhead .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.meta{font-size:13px;color:var(--sumi-2)}
.btn{border:0;border-radius:4px;padding:12px 18px;font-weight:700;font-size:15px}
.btn-main{background:var(--sumi);color:var(--washi)}
.btn-main:active{transform:translateY(1px)}
.btn-ghost{background:transparent;border:1px solid var(--hinoki);color:var(--sumi)}
.btn-soft{background:var(--washi-2);color:var(--sumi)}

.block{background:var(--card);margin:0 0 14px;border-top:5px solid var(--keyaki);
  box-shadow:0 6px 14px rgba(0,0,0,.16)}
.block h3{margin:0;padding:12px 14px 10px;font-family:var(--serif);font-weight:800;font-size:18px;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:1px solid var(--line)}
.block h3 small{font-family:var(--sans);font-weight:500;font-size:12.5px;color:var(--sumi-2);white-space:nowrap}
.block .bnote{margin:0;padding:8px 14px;font-size:13px;color:var(--sumi-2);background:var(--washi-2);border-bottom:1px solid var(--line)}
.ex{display:grid;grid-template-columns:104px 1fr;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex .pic{width:104px;height:78px;background:var(--washi-2);border:1px solid var(--line);border-radius:2px}
.ex h4{margin:0;font-size:16px;font-weight:700;line-height:1.3}
.ex .dose{margin:3px 0 0;font-size:13px;color:var(--sakura-deep);font-weight:700}
.ex .rest{font-size:12.5px;color:var(--sumi-2);font-weight:500}
.ex .desc{grid-column:1/-1;margin:6px 0 0;font-size:14px;color:var(--sumi-2);line-height:1.55}
.ex .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:8px;align-items:center}
.ex .go{background:transparent;border:1px solid var(--hinoki);border-radius:4px;padding:6px 12px;font-size:13px;font-weight:700}
.ex.done h4::after{content:"  済";font-family:var(--serif);color:var(--shu);font-size:14px}
.check{margin-left:auto;font-size:12.5px;color:var(--sumi-2);display:flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0}
.check .box{width:20px;height:20px;border:1.5px solid var(--hinoki);border-radius:3px;display:grid;place-items:center;font-size:13px;color:var(--shu);font-weight:800}

.tips{background:var(--card);border-left:5px solid var(--sakura-deep);padding:12px 14px;box-shadow:0 6px 14px rgba(0,0,0,.16)}
.tips h3{margin:0 0 6px;font-family:var(--serif);font-size:17px}
.tips ul{margin:0;padding-left:18px;font-size:14px;color:var(--sumi-2)}
.tips li{margin:4px 0}
footer{text-align:center;font-size:12px;color:rgba(255,255,255,.75);padding:8px 0 20px}

/* figures */
.fig{display:block;width:100%;height:100%}
.fig .k,.fig .f,.fig .p,.fig .a,.fig .w,.fig .r,.fig .tw,.fig .st,.fig .br,.fig .fl{fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .k{stroke:var(--fig-ink);stroke-width:2.4}.fig .f{stroke:var(--fig-far);stroke-width:2.2}
.fig .p{stroke:var(--fig-prop);stroke-width:1.8}.fig .tw{stroke:var(--fig-prop);stroke-width:3}
.fig .a{stroke:var(--fig-alt);stroke-width:1.5;stroke-dasharray:3 2}
.fig .w,.fig .fl{stroke:var(--fig-floor);stroke-width:2.2}
.fig .r{stroke:var(--fig-arrow);stroke-width:1.2}.fig .rh{fill:var(--fig-arrow)}
.fig .hd{fill:var(--washi-2);stroke:var(--fig-ink);stroke-width:2}
.fig .pf{fill:var(--fig-prop)}.fig .rg{fill:none;stroke:var(--fig-prop);stroke-width:1.6}
.fig .st{stroke:var(--fig-muted);stroke-width:1}.fig .br{stroke:var(--fig-prop);stroke-width:3}
.fig .bag{fill:var(--fig-bag);stroke:var(--fig-ink);stroke-width:1.2}.fig .bn{fill:var(--fig-floor)}
.fig .vs{fill:var(--fig-prop);opacity:.55}
.fig .tx{font-size:4.6px;fill:var(--fig-muted);font-family:var(--sans)}

/* ---------- session overlay ---------- */
.session{position:fixed;inset:0;z-index:50;background:var(--washi);display:none;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.session.open{display:flex}
.s-top{display:flex;align-items:center;gap:10px;padding:10px 14px 8px;border-bottom:1px solid var(--line);
  background:
   repeating-linear-gradient(90deg, transparent 0 calc(20% - 2px), var(--line) calc(20% - 2px) 20%), var(--washi)}
.s-top .x{border:0;background:var(--washi-2);width:38px;height:38px;border-radius:4px;font-size:18px}
.s-top .t{flex:1;min-width:0}
.s-top .t b{display:block;font-family:var(--serif);font-size:15px}
.s-top .t span{font-size:12px;color:var(--sumi-2)}
.prog{height:4px;background:var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--sakura-deep);transition:width .3s}
.s-body{flex:1;overflow:auto;padding:12px 18px 8px;display:flex;flex-direction:column;align-items:center;text-align:center}
.s-pic{width:min(250px,64vw);aspect-ratio:4/3;background:var(--washi-2);border:1px solid var(--line);flex-shrink:0}
.s-block{margin:10px 0 0;font-size:12.5px;color:var(--sumi-2)}
.s-name{margin:2px 0 4px;font-family:var(--serif);font-weight:800;font-size:25px;line-height:1.2}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--washi-2);border:1px solid var(--line)}
.chip.hot{background:var(--sumi);color:var(--washi);border-color:var(--sumi)}
.enso{position:relative;width:min(200px,52vw);aspect-ratio:1;margin:10px auto 6px;flex-shrink:0}
.enso svg{width:100%;height:100%;transform:rotate(-90deg)}
.enso .bg{fill:none;stroke:var(--line);stroke-width:9}
.enso .fg{fill:none;stroke:var(--sumi);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .15s linear}
.enso.rest .fg{stroke:var(--sakura-deep)}
.enso .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.enso .num{font-family:var(--serif);font-weight:800;font-size:clamp(40px,13vw,56px);line-height:1;font-variant-numeric:tabular-nums}
.enso .lbl{font-size:12.5px;color:var(--sumi-2);margin-top:4px}
.s-desc{max-width:460px;font-size:14px;color:var(--sumi-2);margin:4px 0 0;text-align:left}
.s-bar{display:grid;grid-template-columns:1fr 2fr 1fr;gap:8px;padding:10px 14px 12px;border-top:1px solid var(--line)}
.s-bar .btn{padding:14px 8px;font-size:15px}
.s-bar .btn-main{font-size:17px}

.cheer{display:flex;align-items:center;justify-content:center;gap:16px;margin:4px 0 2px;min-height:150px}
.cheer .v{font-family:var(--serif);font-weight:800;font-size:40px;line-height:1.05;writing-mode:vertical-rl;letter-spacing:.06em;color:var(--sumi);flex:none;inline-size:max-content}
.cheer .h{text-align:left;max-width:180px}
.cheer .ro{font-family:var(--serif);font-weight:800;font-size:19px;color:var(--sakura-deep);line-height:1.2}
.cheer .es{font-size:14px;color:var(--sumi-2);margin-top:4px}
.cheer.special{flex-direction:column;gap:6px}
.cheer.special .big{font-family:var(--serif);font-weight:800;font-size:clamp(26px,8vw,36px);line-height:1.15;color:var(--sumi);max-width:320px}
.cheer.special .who{font-size:13px;color:var(--sakura-deep);font-weight:700}
.cheer-anim{animation:ink .7s ease-out}
@keyframes ink{from{opacity:0;filter:blur(6px);transform:scale(.96)}to{opacity:1;filter:none;transform:none}}
@media (prefers-reduced-motion: reduce){.cheer-anim{animation:none}}
.next{display:flex;align-items:center;gap:10px;margin:8px auto 0;padding:8px 10px;border:1px solid var(--line);background:var(--washi-2);max-width:360px;width:100%;text-align:left}
.next .np{width:64px;height:48px;flex-shrink:0}
.next small{display:block;font-size:12px;color:var(--sumi-2)}
.next b{font-size:14.5px}
.prep{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(251,250,245,.0);pointer-events:none}
.finish .big{font-family:var(--serif);font-weight:800;font-size:40px;writing-mode:vertical-rl;line-height:1.05;margin:10px auto;inline-size:max-content}
.finish p{color:var(--sumi-2);max-width:320px}
.s-petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;display:none}
.session.fin .s-petals{display:block}
.ask{position:fixed;inset:0;z-index:70;background:rgba(20,15,10,.55);display:none;align-items:center;justify-content:center;padding:20px}
.ask.open{display:flex}
.ask-box{background:var(--washi);border-top:5px solid var(--keyaki);padding:18px;max-width:340px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.ask-box h3{margin:0 0 6px;font-family:var(--serif);font-size:20px}
.ask-box p{margin:0 0 14px;font-size:14px;color:var(--sumi-2)}
.ask-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--sumi);color:var(--washi);padding:9px 14px;border-radius:4px;font-size:13.5px;z-index:60;display:none}
@media (min-width:560px){ .shoji{height:290px} }
</style>
</head>
<body>

<header class="shoji" aria-label="Dojo">
  <div class="scroll"><h1>道場</h1><div class="seal" aria-hidden="true">押忍</div></div>
    <svg class="tree" viewBox="0 0 420 268" aria-hidden="true">
    <defs>
      <symbol id="fl" viewBox="-10 -10 20 20">
        <g fill="currentColor"><circle cx="0" cy="-4.6" r="4"/><circle cx="4.4" cy="-1.4" r="4"/><circle cx="2.7" cy="3.7" r="4"/><circle cx="-2.7" cy="3.7" r="4"/><circle cx="-4.4" cy="-1.4" r="4"/></g>
        <circle r="1.8" fill="#b23a5e"/>
      </symbol>
    </defs>
    <g fill="none" stroke="#4a3426" stroke-linecap="round">
      <path d="M418 272 C 385 232, 372 196, 352 160" stroke-width="20"/>
      <path d="M360 172 C 320 140, 270 128, 214 104" stroke-width="10"/>
      <path d="M270 126 C 250 100, 232 80, 206 64" stroke-width="6"/>
      <path d="M354 162 C 352 120, 334 90, 312 58" stroke-width="9"/>
      <path d="M334 96 C 360 72, 382 60, 404 40" stroke-width="5"/>
      <path d="M218 106 C 182 98, 152 100, 118 88" stroke-width="5.5"/>
      <path d="M164 100 C 152 118, 140 128, 122 136" stroke-width="3.5"/>
      <path d="M312 58 C 302 42, 290 34, 272 28" stroke-width="3.5"/>
      <path d="M240 112 C 236 132, 228 148, 214 160" stroke-width="3"/>
    </g>
    <g id="blooms"></g>
  </svg>
  <div class="petals" id="petals"></div>
</header>

<nav class="nav" aria-label="Días de la semana">
  <div class="beam"></div>
  <div class="plaques" role="tablist" id="plaques"></div>
</nav>

<main id="day"></main>
<footer>七転び八起き</footer>

<section class="session" id="session" aria-live="polite">
  <div class="s-top">
    <button class="x" id="sClose" aria-label="Salir del entrenamiento">✕</button>
    <div class="t"><b id="sDay"></b><span id="sCount"></span></div>
    <button class="x" id="sSound" aria-label="Pitidos activados">🔔</button>
  </div>
  <div class="prog"><i id="sProg"></i></div>
  <div class="s-body" id="sBody"></div>
  <div class="s-bar" id="sBar"></div>
  <div class="s-petals" id="sPetals"></div>
</section>
<div class="ask" id="ask" role="dialog" aria-modal="true" aria-labelledby="askT">
  <div class="ask-box"><h3 id="askT">¿Salir del entrenamiento?</h3><p>Lo que ya hayas terminado queda marcado como hecho.</p>
  <div class="ask-btns"><button class="btn btn-soft" id="askNo">Seguir entrenando</button><button class="btn btn-main" id="askYes">Salir</button></div></div>
</div>

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fig = (key, label) => `<svg class="fig" viewBox="0 0 100 75" role="img" aria-label="${esc(label||'')}">${POSES[key]||""}</svg>`;
const fmt = s => { s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60), r=s%60; return m? `${m}:${String(r).padStart(2,"0")}` : `${r}`; };
const fmtLong = s => { s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60), r=s%60; return `${m}:${String(r).padStart(2,"0")}`; };
const todayKey = () => { const d=new Date(); return `dojo-done-${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
function loadDone(){ try{ return new Set(JSON.parse(localStorage.getItem(todayKey())||"[]")); }catch(e){ return new Set(); } }
function saveDone(set){ try{ localStorage.setItem(todayKey(), JSON.stringify([...set])); }catch(e){} }
let DONE = loadDone();
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display="none",1800); }

/* ---------------- sakura ---------------- */
(function sakura(){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const pts=[[118,88],[122,136],[150,98],[176,92],[206,64],[214,104],[240,112],[214,160],[230,82],[272,28],[290,44],[312,58],[300,80],[404,40],[372,62],[262,122],[140,74],[190,110],[330,110],[256,58]];
  const cols=["#f7c6d3","#f3b0c3","#ee9ab2","#fadbe3","#e7839f","#f9d0dc"];
  let h="";
  pts.forEach(([x,y])=>{ const n=7+Math.floor(rnd()*7);
    for(let i=0;i<n;i++){ const a=rnd()*6.283, r=rnd()*20, s=7+rnd()*8;
      h+=`<use href="#fl" x="${(x+Math.cos(a)*r-s/2).toFixed(1)}" y="${(y+Math.sin(a)*r*.8-s/2).toFixed(1)}" width="${s.toFixed(1)}" height="${s.toFixed(1)}" style="color:${cols[Math.floor(rnd()*cols.length)]}" transform="rotate(${Math.floor(rnd()*70)} ${x} ${y})"/>`; } });
  document.getElementById("blooms").innerHTML=h;
  const mk=(el,n)=>{ let p=""; for(let i=0;i<n;i++){ p+=`<span class="petal" style="left:${(8+Math.random()*92).toFixed(1)}%;animation-duration:${(8+Math.random()*9).toFixed(1)}s;animation-delay:-${(Math.random()*14).toFixed(1)}s;transform:scale(${(.7+Math.random()*.6).toFixed(2)})"></span>`; } el.innerHTML=p; };
  mk(document.getElementById("petals"),14);
  mk(document.getElementById("sPetals"),18);
})();

/* ---------------- day view ---------------- */
let cur = (new Date().getDay()+6)%7;
const todayIdx = (new Date().getDay()+6)%7;
function renderPlaques(){
  $("#plaques").innerHTML = DAYS.map((d,i)=>`<button class="plaque" role="tab" aria-selected="${i===cur}" aria-label="${d.name}: ${d.title}" data-i="${i}">
    <span class="k">${d.k}</span><span class="s">${d.s}</span>${i===todayIdx?'<span class="today" aria-hidden="true">今</span>':''}</button>`).join("");
}
$("#plaques").addEventListener("click",e=>{ const b=e.target.closest(".plaque"); if(!b) return; cur=+b.dataset.i; renderPlaques(); renderDay(); });

function exId(di,bi,ei){ return `${di}-${bi}-${ei}`; }
function doseText(ex){ return ex.sets>1 ? `${ex.sets} × ${ex.reps}` : ex.reps; }
function countEx(d){ return d.blocks.reduce((a,b)=>a+b.ex.length,0); }
function renderDay(){
  const d=DAYS[cur]; const total=countEx(d);
  const done=d.blocks.reduce((a,b,bi)=>a+b.ex.filter((_,ei)=>DONE.has(exId(cur,bi,ei))).length,0);
  let h=`<section class="dayhead"><div class="jp">${d.jp}</div><h2>${d.name}: ${d.title}</h2><p class="what">${d.what}</p>
    <div class="row"><span class="meta">Unos ${d.dur}${cur===todayIdx?` · hoy llevas ${done} de ${total}`:""}</span>
    <button class="btn btn-main" data-start="0-0">Empezar entrenamiento</button></div></section>`;
  d.blocks.forEach((b,bi)=>{
    h+=`<section class="block"><h3><span>${b.name}</span><small>${b.mins}${b.rounds?` · ${b.rounds} rondas`:""}</small></h3>${b.note?`<p class="bnote">${b.note}</p>`:""}`;
    b.ex.forEach((ex,ei)=>{ const id=exId(cur,bi,ei); const isDone=DONE.has(id);
      const restTxt = ex.rest? (ex.sets>1||b.rounds? `descanso ${ex.rest} s`:"") : "";
      h+=`<article class="ex${isDone?" done":""}">
        <div class="pic">${fig(ex.img, ex.n)}</div>
        <div><h4>${ex.n}</h4><p class="dose">${doseText(ex)}${ex.work?" ⏱":""}</p>${restTxt?`<span class="rest">${restTxt}</span>`:""}</div>
        <p class="desc">${ex.d}</p>
        <div class="acts"><button class="go" data-start="${bi}-${ei}">▶ Empezar aquí</button>
        <button class="check" data-check="${id}" aria-pressed="${isDone}"><span class="box">${isDone?"✓":""}</span>Hecho</button></div>
      </article>`; });
    h+=`</section>`;
  });
  h+=`<section class="tips"><h3>Consejos del sensei</h3><ul>${d.tips.map(t=>`<li>${t}</li>`).join("")}</ul></section>`;
  $("#day").innerHTML=h;
}
$("#day").addEventListener("click",e=>{
  const s=e.target.closest("[data-start]"); if(s){ const [bi,ei]=s.dataset.start.split("-").map(Number); startSession(cur,bi,ei); return; }
  const c=e.target.closest("[data-check]"); if(c){ const id=c.dataset.check; DONE.has(id)?DONE.delete(id):DONE.add(id); saveDone(DONE); renderDay(); }
});

/* ---------------- audio / wake lock ---------------- */
let actx=null, soundOn=true, wake=null;
function ensureAudio(){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(f=660,dur=.12,vol=.18){ if(!soundOn||!actx) return; try{ const o=actx.createOscillator(), g=actx.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(vol,actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+.02);}catch(e){} }
function gong(){ beep(880,.35,.22); setTimeout(()=>beep(1175,.45,.18),160); try{navigator.vibrate&&navigator.vibrate([120,60,120])}catch(e){} }
async function lockScreen(){ try{ if("wakeLock" in navigator) wake=await navigator.wakeLock.request("screen"); }catch(e){} }
function unlockScreen(){ try{ wake&&wake.release(); }catch(e){} wake=null; }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&S.open) lockScreen(); });

function buildSteps(di){
  const d=DAYS[di]; const steps=[];
  const work=(ex,bi,ei,o)=>{
    const base={kind:"work",ex,bi,ei,set:o.set,sets:o.sets,round:o.round,rounds:o.rounds,block:d.blocks[bi].name};
    if(ex.work&&ex.sides){
      steps.push({...base,side:"Lado derecho",timed:ex.work,last:false});
      steps.push({kind:"rest",sec:5,label:"Cambia de lado",cheer:false});
      steps.push({...base,side:"Lado izquierdo",timed:ex.work,last:o.last});
    } else steps.push({...base,timed:ex.work||null,last:o.last});
  };
  d.blocks.forEach((b,bi)=>{
    if(b.rounds){
      for(let r=1;r<=b.rounds;r++){
        b.ex.forEach((ex,ei)=>{
          work(ex,bi,ei,{set:1,sets:1,round:r,rounds:b.rounds,last:r===b.rounds});
          if(ei<b.ex.length-1) steps.push({kind:"rest",sec:ex.rest||15,label:"Transición",cheer:true});
          else steps.push({kind:"rest",sec:b.roundRest||60,label:r<b.rounds?"Descanso entre rondas":"Siguiente ejercicio",cheer:true});
        });
      }
    } else {
      b.ex.forEach((ex,ei)=>{
        for(let s=1;s<=ex.sets;s++){
          work(ex,bi,ei,{set:s,sets:ex.sets,last:s===ex.sets});
          if(s<ex.sets) steps.push({kind:"rest",sec:ex.rest||20,label:"Descanso",cheer:true});
        }
        steps.push({kind:"rest",sec:Math.max(ex.rest||0,20),label:"Siguiente ejercicio",cheer:true});
      });
    }
  });
  while(steps.length&&steps[steps.length-1].kind==="rest") steps.pop();
  steps.push({kind:"finish"});
  let nxt=null; for(let i=steps.length-1;i>=0;i--){ if(steps[i].kind==="work") nxt=steps[i]; else if(steps[i].kind==="rest") steps[i].next=nxt; }
  return steps;
}

function startSession(di,bi,ei){
  ensureAudio();
  S.day=di; S.steps=buildSteps(di);
  S.i=Math.max(0,S.steps.findIndex(s=>s.kind==="work"&&s.bi===bi&&s.ei===ei));
  S.open=true; S.startedAt=Date.now();
  $("#session").classList.add("open"); $("#session").classList.remove("fin");
  document.body.style.overflow="hidden";
  lockScreen(); enterStep(false);
}
function closeSession(){
  stopTimer(); S.open=false; $("#session").classList.remove("open","fin");
  document.body.style.overflow=""; unlockScreen(); renderDay();
}
$("#sClose").onclick=()=>{ if(S.steps[S.i]&&S.steps[S.i].kind==="finish"){ closeSession(); return; } $("#ask").classList.add("open"); $("#askNo").focus(); };
$("#askNo").onclick=()=>$("#ask").classList.remove("open");
$("#askYes").onclick=()=>{ $("#ask").classList.remove("open"); closeSession(); };
$("#ask").addEventListener("click",e=>{ if(e.target.id==="ask") $("#ask").classList.remove("open"); });
$("#sSound").onclick=()=>{ soundOn=!soundOn; $("#sSound").textContent=soundOn?"🔔":"🔕"; $("#sSound").setAttribute("aria-label",soundOn?"Sonido activado":"Sonido desactivado"); };

function stopTimer(){ clearInterval(tickH); tickH=null; T.mode="idle"; }
function startCountdown(sec,mode){ stopTimer(); T.mode=mode; T.total=sec; T.remain=sec; T.endAt=performance.now()+sec*1000; T.lastBeep=null; tickH=setInterval(tick,100); tick(); }
function startStopwatch(){ stopTimer(); T.mode="sw"; T.swStart=performance.now(); tickH=setInterval(tick,250); tick(); }

function tick(){
  const st=S.steps[S.i];
  if(T.mode==="run"||T.mode==="rest"||T.mode==="prep"){
    T.remain=(T.endAt-performance.now())/1000;
    const whole=Math.ceil(T.remain);
    if(whole<=3&&whole>=1&&T.lastBeep!==whole){ T.lastBeep=whole; beep(T.mode==="prep"?520:600,.1); }
    if(T.remain<=0){
      if(T.mode==="prep"){ gong(); startCountdown(st.timed,"run"); const l=$("#tLbl"); if(l) l.textContent=st.timed>=60?"minutos":"segundos"; paintBar(); return; }
      gong(); stopTimer(); advance(true); return;
    }
  }
  paintTimer();
}
function paintTimer(){
  const num=$("#tNum"), fg=$("#tFg"); if(!num||!fg) return;
  const C=2*Math.PI*86;
  if(T.mode==="sw"){ num.textContent=fmtLong((performance.now()-T.swStart)/1000); fg.style.strokeDashoffset=C; fg.style.opacity=0; return; }
  fg.style.opacity=1;
  if(T.mode==="idle"||T.mode==="pause"){ const st=S.steps[S.i]; if(st.kind==="work"&&st.timed&&T.mode==="idle"){ num.textContent=fmt(st.timed); fg.style.strokeDashoffset=0; } else if(T.mode==="pause"){ num.textContent=fmt(T.remain); } return; }
  if(T.mode==="prep"){ num.textContent=Math.ceil(T.remain); fg.style.strokeDashoffset=C*(1-T.remain/3); return; }
  num.textContent=fmt(T.remain);
  fg.style.strokeDashoffset = C*(1-Math.max(0,T.remain)/T.total);
}

function advance(auto){
  const st=S.steps[S.i];
  if(st&&st.kind==="work"&&st.last){ DONE.add(exId(S.day,st.bi,st.ei)); saveDone(DONE); }
  S.i=Math.min(S.i+1,S.steps.length-1); enterStep(auto);
}
function goBack(){ stopTimer(); let j=S.i-1; while(j>0&&S.steps[j].kind!=="work") j--; S.i=Math.max(0,j); enterStep(false); }

function pickCheer(){
  if(Math.random()<0.2){ return {special:SPECIAL[Math.floor(Math.random()*SPECIAL.length)]}; }
  let k; do{ k=Math.floor(Math.random()*CHEERS.length);}while(k===S.lastCheer&&CHEERS.length>1); S.lastCheer=k; return CHEERS[k];
}
const ensoSVG = cls => `<div class="enso ${cls||""}"><svg viewBox="0 0 200 200" aria-hidden="true">
  <defs><filter id="brush"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter></defs>
  <circle class="bg" cx="100" cy="100" r="86"/>
  <circle class="fg" id="tFg" cx="100" cy="100" r="86" filter="url(#brush)" stroke-dasharray="${(2*Math.PI*86).toFixed(1)}" stroke-dashoffset="0"/></svg>
  <div class="mid"><div class="num" id="tNum"></div><div class="lbl" id="tLbl"></div></div></div>`;

function stepCount(){
  const works=S.steps.filter(s=>s.kind==="work"); const seen=new Set(); let idx=0, tot=0;
  works.forEach(w=>{ const k=w.bi+"-"+w.ei; if(!seen.has(k)){ seen.add(k); tot++; } });
  const seen2=new Set(); for(let j=0;j<=S.i;j++){ const s=S.steps[j]; if(s.kind==="work"){ seen2.add(s.bi+"-"+s.ei);} } idx=seen2.size;
  return {idx,tot};
}
function enterStep(auto){
  stopTimer();
  const st=S.steps[S.i], d=DAYS[S.day];
  $("#sDay").textContent=`${d.name}: ${d.title}`;
  const c=stepCount(); $("#sCount").textContent= st.kind==="finish" ? "Entrenamiento terminado" : `Ejercicio ${Math.max(1,c.idx)} de ${c.tot}`;
  $("#sProg").style.width = `${Math.round(100*S.i/(S.steps.length-1))}%`;
  const body=$("#sBody");
  if(st.kind==="work"){
    const ex=st.ex; const chips=[];
    if(st.rounds) chips.push(`<span class="chip">Ronda ${st.round} de ${st.rounds}</span>`);
    if(st.sets>1) chips.push(`<span class="chip hot">Serie ${st.set} de ${st.sets}</span>`);
    if(st.side) chips.push(`<span class="chip hot">${st.side}</span>`);
    body.innerHTML=`<div class="s-pic">${fig(ex.img,ex.n)}</div><p class="s-block">${esc(st.block)}</p>
      <h2 class="s-name">${ex.n}</h2><div class="chips">${chips.join("")}<span class="chip">${esc(/^[\d\-]+$/.test(ex.reps)?ex.reps+" reps":ex.reps)}</span></div>
      ${ensoSVG("")}<p class="s-desc">${ex.d}</p>`;
    if(st.timed){ $("#tLbl").textContent="segundos"; if(st.timed>=60) $("#tLbl").textContent="minutos"; }
    else { $("#tLbl").textContent="tiempo de la serie"; }
    if(st.timed){ if(auto) startCountdown(st.timed,"run"); else { T.mode="idle"; paintTimer(); } }
    else startStopwatch();
  } else if(st.kind==="rest"){
    let cheerHTML="";
    if(st.cheer){ const c=pickCheer();
      cheerHTML = c.special ? `<div class="cheer special cheer-anim"><div class="big">${esc(c.special.big)}</div><div class="who">${esc(c.special.who)}</div></div>`
        : `<div class="cheer cheer-anim"><div class="v" lang="ja">${c.jp}</div><div class="h"><div class="ro">${c.ro}</div><div class="es">${c.es}</div></div></div>`;
    } else cheerHTML=`<h2 class="s-name" style="margin-top:14px">${st.label}</h2><p class="s-block" style="margin:0 0 4px">Respira por la nariz y suelta los hombros.</p>`;
    const n=st.next;
    const nextHTML = n ? `<div class="next"><div class="np">${fig(n.ex.img,n.ex.n)}</div><div><small>Siguiente${n.sets>1?` · serie ${n.set} de ${n.sets}`:""}${n.side?` · ${n.side.toLowerCase()}`:""}</small><b>${n.ex.n}</b></div></div>` : "";
    body.innerHTML = cheerHTML + ensoSVG("rest") + nextHTML;
    $("#tLbl").textContent = st.cheer ? st.label.toLowerCase() : "descanso";
    startCountdown(st.sec,"rest");
  } else {
    const mins=Math.max(1,Math.round((Date.now()-S.startedAt)/60000));
    body.innerHTML=`<div class="finish"><div class="big" lang="ja">お疲れ様でした</div><p><b>Otsukaresama deshita.</b> Buen trabajo: ${DAYS[S.day].name.toLowerCase()} completado en ${mins} min.</p><p>${Math.random()<.5?"They don't know me, son!":"¿Entonces ellos ganan? Hoy no."}</p></div>`;
    $("#session").classList.add("fin"); gong();
  }
  paintBar();
}
function paintBar(){
  const st=S.steps[S.i], bar=$("#sBar");
  const prev=`<button class="btn btn-soft" id="bPrev" ${S.i===0?"disabled":""}>Anterior</button>`;
  if(st.kind==="work"){
    let main;
    if(st.timed){ main = T.mode==="run" ? "Pausa" : T.mode==="pause" ? "Seguir" : T.mode==="prep" ? "Prepárate…" : "Empezar"; }
    else main = st.sets>1 ? "Serie hecha ✓" : "Hecho ✓";
    bar.innerHTML=`${prev}<button class="btn btn-main" id="bMain">${main}</button><button class="btn btn-soft" id="bSkip">Saltar</button>`;
  } else if(st.kind==="rest"){
    bar.innerHTML=`${prev}<button class="btn btn-main" id="bSkip">Saltar descanso</button><button class="btn btn-soft" id="bAdd">+15 s</button>`;
  } else {
    bar.innerHTML=`<span></span><button class="btn btn-main" id="bEnd">Volver al plan</button><span></span>`;
  }
  const on=(id,f)=>{ const el=document.getElementById(id); if(el) el.onclick=f; };
  on("bPrev",()=>goBack());
  on("bSkip",()=>{ stopTimer(); advance(false); });
  on("bAdd",()=>{ T.endAt+=15000; T.total+=15; });
  on("bEnd",()=>closeSession());
  on("bMain",()=>{
    ensureAudio();
    if(!st.timed){ advance(false); return; }
    if(T.mode==="run"){ T.remain=(T.endAt-performance.now())/1000; clearInterval(tickH); tickH=null; T.mode="pause"; }
    else if(T.mode==="pause"){ T.endAt=performance.now()+T.remain*1000; T.mode="run"; tickH=setInterval(tick,100); }
    else if(T.mode==="idle"){ startCountdown(3,"prep"); $("#tLbl").textContent="prepárate"; }
    paintBar(); paintTimer();
  });
}

/* ---------------- boot ---------------- */
renderPlaques(); renderDay();
/* ---------------- app instalable ---------------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
